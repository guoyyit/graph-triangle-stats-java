# Graph triangle statistics service
# Upper bounds; batches that would exceed them are rejected with HTTP 507.
graph.stats.max-vertices=100000
graph.stats.max-edges=500000
graph.stats.max-vertex-id-length=256
# How many committed snapshots are retained for at-version queries.
graph.stats.retained-versions=16
# Directory of the durable write-ahead log used for crash recovery.
graph.stats.wal-dir=data/wal
